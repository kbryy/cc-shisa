name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        type: choice
        options:
          - patch
          - minor
          - major
        required: true
        default: patch

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.bump || github.ref }}
  cancel-in-progress: false

jobs:
  bump-pr:
    name: Open release PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Bump and open PR
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          current=$(jq -r .version package.json)
          IFS=. read -r major minor patch <<<"$current"
          case "$BUMP" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
            *) echo "unknown bump: $BUMP" >&2; exit 1 ;;
          esac
          new="${major}.${minor}.${patch}"
          branch="release/v${new}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"

          jq --arg v "$new" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          sed -i "s/^export const VERSION = \".*\";$/export const VERSION = \"${new}\";/" src/version.ts

          git add package.json src/version.ts
          git commit -m "chore(release): v${new}"
          git push origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(release): v${new}" \
            --body "Bump version to v${new}. Auto-merge enabled — PR will land once CI is green."
          gh pr merge "$branch" --auto --squash --delete-branch

  prepare:
    name: Prepare release
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Tag merged release commit
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          version="${HEAD_REF#release/v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${version}" -m "release v${version}"
          git push origin "v${version}"
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"
      - name: Resolve tag
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            v="$RELEASE_VERSION"
          else
            tag="$REF_NAME"
            v="${tag#v}"
          fi
          echo "tag=v${v}" >> "$GITHUB_OUTPUT"
          echo "version=${v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            runner: macos-latest
            asset: cc-shisa-darwin-arm64
          - target: bun-darwin-x64
            runner: macos-latest
            asset: cc-shisa-darwin-x64
          - target: bun-linux-arm64
            runner: ubuntu-24.04-arm
            asset: cc-shisa-linux-arm64
          - target: bun-linux-x64
            runner: ubuntu-latest
            asset: cc-shisa-linux-x64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: bun install --frozen-lockfile
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: bun build --compile --minify --target="$TARGET" ./src/cli.ts --outfile="$ASSET"
      - name: Smoke
        if: matrix.target == 'bun-darwin-arm64' || matrix.target == 'bun-linux-x64'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          "./$ASSET" version
          echo '' | "./$ASSET" hook | grep -q '"permissionDecision":"ask"'
      - name: Compute checksum
        env:
          ASSET: ${{ matrix.asset }}
        run: shasum -a 256 "$ASSET" > "${ASSET}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            dist/cc-shisa-*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  update-tap:
    name: Update Homebrew tap
    needs: [prepare, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Read checksums
        id: sha
        run: |
          for asset in cc-shisa-darwin-arm64 cc-shisa-darwin-x64 cc-shisa-linux-arm64 cc-shisa-linux-x64; do
            sha=$(awk '{print $1}' "dist/${asset}.sha256")
            slug=$(echo "$asset" | sed 's/cc-shisa-//; s/-/_/g')
            echo "sha_${slug}=${sha}" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout homebrew-tap
        uses: actions/checkout@v6
        with:
          repository: kbryy/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Render Formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA_DARWIN_ARM64: ${{ steps.sha.outputs.sha_darwin_arm64 }}
          SHA_DARWIN_X64: ${{ steps.sha.outputs.sha_darwin_x64 }}
          SHA_LINUX_ARM64: ${{ steps.sha.outputs.sha_linux_arm64 }}
          SHA_LINUX_X64: ${{ steps.sha.outputs.sha_linux_x64 }}
        run: |
          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/cc-shisa.rb <<RUBY
          class CcShisa < Formula
            desc "Static-analysis PreToolUse hook for Claude Code's Bash tool"
            homepage "https://github.com/kbryy/cc-shisa"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/kbryy/cc-shisa/releases/download/v#{version}/cc-shisa-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "https://github.com/kbryy/cc-shisa/releases/download/v#{version}/cc-shisa-darwin-x64"
                sha256 "${SHA_DARWIN_X64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/kbryy/cc-shisa/releases/download/v#{version}/cc-shisa-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "https://github.com/kbryy/cc-shisa/releases/download/v#{version}/cc-shisa-linux-x64"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              bin.install Dir["cc-shisa-*"].first => "cc-shisa"
              chmod 0755, bin/"cc-shisa"
              generate_completions_from_executable(bin/"cc-shisa", "completion")
            end

            test do
              assert_match(/^\d+\.\d+\.\d+/, shell_output("#{bin}/cc-shisa version"))
            end
          end
          RUBY

      - name: Commit and push
        working-directory: homebrew-tap
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cc-shisa.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "cc-shisa ${VERSION}"
          git push

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Build for host
        run: bun build --compile --minify ./src/cli.ts --outfile=cc-shisa
      - name: Smoke
        run: |
          ./cc-shisa version
          echo '' | ./cc-shisa hook | grep -q '"permissionDecision":"ask"'
